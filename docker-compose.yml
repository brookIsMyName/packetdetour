services:

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: packetdetour_user
      POSTGRES_PASSWORD: packetdetour_dev
      POSTGRES_DB: packetdetour

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U packetdetour_user -d packetdetour"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  server:
    build:
      context: ./server

    environment:
      DATABASE_URL: postgresql://packetdetour_user:packetdetour_dev@postgres:5432/packetdetour

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy


  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000

    ports:
      - "3001:3001"

    depends_on:
      - server


volumes:
  postgres_data:
